[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "theia-chat-transfer"
version = "0.1.0"
description = "Move Eclipse Theia AI chat history between machines, rewriting absolute paths."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = []

[project.scripts]
theia-chat-transfer = "theia_chat_transfer.transfer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
